<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a0b">
<title>Фамилья — стол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/qrcode.js"></script>
<style>
html,body{height:100%}
body{overflow-x:hidden}
.page{min-height:100%;padding:18px max(18px,env(safe-area-inset-right)) 18px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h1{font-size:30px;color:var(--brass)}
.bar .tools{display:flex;gap:8px;flex-wrap:wrap}
/* лобби */
.lobby{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:22px;align-items:start;max-width:1100px;margin:0 auto;width:100%}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:22px}
.qr{background:#fff;border-radius:12px;padding:10px;width:max-content;align-self:center}
.qr svg{display:block;width:230px;height:230px}
.link{font-family:ui-monospace,Menlo,monospace;font-size:15px;text-align:center;word-break:break-all;user-select:all;color:var(--brass2)}
.hint{font-size:13px;color:var(--muted)}
.seats{display:flex;flex-direction:column;gap:8px}
.seat-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25)}
.seat-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.rules{columns:2 280px;column-gap:24px;font-size:14px;color:#d8c9b6}
.rules p{margin:0 0 8px;break-inside:avoid}
.rules b{color:var(--brass2)}
/* стол */
.board{position:relative;flex:1;min-height:760px;border-radius:50%/40%;background:radial-gradient(ellipse at center,#2a1a10 0%,#1a0f0b 55%,transparent 72%)}
.seat{position:absolute;transform:translate(-50%,-50%);width:200px;background:rgba(26,16,18,.94);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;transition:box-shadow .2s,border-color .2s}
.seat .card{width:62px;font-size:8px}
.seat .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .ch{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.seat .chips{display:flex;flex-wrap:wrap;gap:3px}
.seat.turn{border-color:var(--brass2);box-shadow:0 0 0 2px rgba(230,198,114,.35),0 0 34px rgba(230,198,114,.3)}
.seat.wait{border-color:var(--bad)}
.seat.dead{filter:grayscale(1) brightness(.55)}
.seat .turn-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brass);color:#1a1205;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px;white-space:nowrap}
.seat .c4tick{color:#ff6b5e;font-weight:700}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,40%);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.now{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.2;text-wrap:balance}
.piles{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.pile{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pile .card{width:70px;font-size:11px}
.check{display:flex;gap:10px;align-items:center;justify-content:center;font-size:15px}
.check .card{width:64px;font-size:8px}
.check .ok{color:var(--good);font-weight:700}.check .no{color:var(--bad);font-weight:700}
.lootrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lootrow .card{width:62px;font-size:8px}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:110px;overflow:hidden;width:100%}
.log div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log div:first-child{color:var(--fg);font-size:15px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1100px;margin:0 auto;width:100%}
.chars .slot{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.chars .card{width:100%}
.chars .wait{aspect-ratio:2/3;width:100%;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.opts-grid{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:rgba(0,0,0,.2)}
.opt input{width:18px;height:18px;margin-top:2px;accent-color:var(--brass)}
.opt b{display:block}.opt small{color:var(--muted);font-size:12px}
.evbig{display:flex;flex-direction:column;gap:6px;align-items:center}
.evbig img{width:min(170px,100%);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:block}
.evtxt{display:flex;flex-direction:column;font-size:13px}
.evbig img+.evtxt b{display:none}
.evtxt b{font-family:var(--display);color:var(--brass2);font-size:20px}
.zrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.zcard{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 8px 4px 4px;background:rgba(0,0,0,.35);font-size:12px}
.zcard img{width:46px;aspect-ratio:3/2;object-fit:cover;border-radius:4px}
.zcard b{display:block;font-size:13px}.zcard span{color:var(--muted)}
.vote{font-family:var(--display);font-size:20px;color:#ffb0aa}
.over{position:fixed;inset:0;background:rgba(10,6,7,.88);z-index:30;display:grid;place-items:center;padding:24px}
.over-in{max-width:980px;width:100%;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.over h2{font-size:clamp(28px,4vw,46px);color:var(--brass2)}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;width:100%}
.reveal .slot{display:flex;flex-direction:column;gap:6px;align-items:center}
.reveal .card{width:100%;font-size:10px}
@media (max-width:900px){
  .board{border-radius:0;background:none;min-height:0;display:flex;flex-direction:column;gap:10px}
  .seat{position:relative;transform:none;left:auto!important;top:auto!important;width:100%}
  .center{position:relative;transform:none;left:auto;top:auto;width:100%;order:-1}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ROLES = {godfather:"Крёстный отец", guard:"Телохранитель", cop:"Полицейский", rat:"Крыса", journalist:"Журналист"};
const OPTS = [["extra","Новые карты","Допрос, Подкуп, Засада, Кастет, Молотов и др."],["events","События города","Каждый круг — новое правило"],["zones","Районы","Порт, Казино, Бар"],["shodka","Сходка","Раз за игру тайное голосование"],["debt","Долги","Взять 2 карты, вернуть 3"],["journalist","Журналист","На 7–8 игроков вместо одного Полицейского"]];
let S = null, ver = 0, connected = false;

async function api(path, data){
  try {
    const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data || {})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) toast(j.error || "Не получилось");
    return r.ok;
  } catch(e) { toast("Нет связи с сервером"); return false; }
}
async function loop(){
  for (;;) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 35000);
      const r = await fetch(`/api/poll?pid=table&v=${ver}`, {cache:"no-store", signal:ctl.signal});
      clearTimeout(tm);
      if (!r.ok) throw 0;
      const j = await r.json(); ver = j.v; S = j.s; connected = true; render();
    } catch(e) { connected = false; render(); await new Promise(r => setTimeout(r, 1500)); }
  }
}
let toastT;
function toast(t){
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600);
}
function cardHtml(c, cls = ""){
  const red = c.suit === "♥" || c.suit === "♦";
  return `<div class="card k-${c.kind || "brown"} ${cls}"><div class="fb"><b>${esc(c.n)}</b><small>${esc(c.d || "")}</small></div><img src="/card/${c.key}" alt="${esc(c.n)}" onerror="this.remove()">${c.suit ? `<span class="suit ${red ? "red" : ""}">${c.rank}${c.suit}</span>` : ""}</div>`;
}
const charCard = ch => `<div class="card"><div class="fb"><b>${esc(ch.n)}</b><small>${esc(ch.d)}</small></div><img src="/card/${ch.key}" alt="${esc(ch.n)}" onerror="this.remove()"></div>`;
const roleCard = r => `<div class="card"><div class="fb"><b>${ROLES[r]}</b></div><img src="/card/role-${r}" alt="${ROLES[r]}" onerror="this.remove()"></div>`;
const backCard = () => `<div class="card"><div class="fb"><b>Фамилья</b></div><img src="/card/back" alt="" onerror="this.remove()" style="object-fit:contain;padding:8%"></div>`;
const hearts = (hp, max) => `<span class="hearts">${"♥".repeat(Math.max(0, hp))}<i>${"♥".repeat(Math.max(0, max - hp))}</i></span>`;
const roleBadge = r => r ? `<span class="role-badge r-${r}">${ROLES[r]}</span>` : "";

/* «нажмите дважды» для опасных кнопок */
const armed = new WeakMap();
function guard(b, fn){
  b.onclick = () => {
    if (!armed.get(b)) { armed.set(b, b.textContent); b.classList.add("armed"); b.textContent = "Точно? Нажмите ещё раз"; setTimeout(() => { if (armed.get(b)) { b.textContent = armed.get(b); b.classList.remove("armed"); armed.delete(b); } }, 3000); return; }
    armed.delete(b); fn();
  };
}

function joinUrl(){
  if (S.url) return S.url;
  const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (local && S.lan && S.lan[0]) return `http://${S.lan[0]}:${location.port || S.port}`;
  return location.origin;
}
let lastQr = "";
function paintQr(){
  const box = document.getElementById("qr"); if (!box || !window.qrcode) return;
  const u = joinUrl();
  if (box.dataset.u === u) return;
  try { const q = qrcode(0, "M"); q.addData(u); q.make(); box.innerHTML = q.createSvgTag({cellSize:6, margin:2, scalable:true}); box.dataset.u = u; } catch(e) {}
}

function render(){
  if (!S) { app.innerHTML = `<div class="page"><p class="muted">${connected ? "Загружаем…" : "Подключаемся к серверу…"}</p></div>`; return; }
  if (S.phase === "lobby") return renderLobby();
  if (S.phase === "chars") return renderChars();
  renderBoard();
}

function tunnelLine(){
  if (S.tunnel === "on") return `<p class="hint" style="margin:0;text-align:center">Ссылка работает с любого интернета.</p>`;
  if (S.tunnel === "starting") return `<p class="hint" style="margin:0;text-align:center">Получаем ссылку в интернет… Пока можно подключаться через Wi-Fi.</p>`;
  if (S.tunnel === "error") return `<p class="hint" style="margin:0;text-align:center;color:var(--warn)">Ссылка в интернет не получилась. Работает подключение через общий Wi-Fi.</p>`;
  return `<p class="hint" style="margin:0;text-align:center">Телефоны должны быть в той же Wi-Fi сети, что и ноутбук.</p>`;
}

function renderLobby(){
  const n = S.lobby.length;
  app.innerHTML = `<div class="page">
    <div class="bar"><h1>Фамилья</h1><span class="hint">${connected ? "" : "нет связи с сервером"}</span></div>
    <div class="lobby">
      <div class="panel">
        <h2>Подключайтесь</h2>
        <div class="qr" id="qr"></div>
        <div class="link">${esc(joinUrl())}</div>
        ${tunnelLine()}
      </div>
      <div class="panel">
        <h2>За столом: ${n} из 8</h2>
        <div class="seats">${S.lobby.map(p => `<div class="seat-row"><span class="dot ${p.online ? "on" : ""}"></span><b>${esc(p.name)}</b><button class="btn sm ghost" data-kick="${esc(p.id)}">Убрать</button></div>`).join("") || `<p class="muted" style="margin:0">Пока никого. Отсканируйте QR-код телефоном и введите имя.</p>`}</div>
        <button class="btn brass big" id="start" ${n >= 4 && n <= 8 ? "" : "disabled"}>${n < 4 ? `Нужно ещё ${4 - n}` : "Раздать роли и начать"}</button>
        <p class="hint" style="margin:0">Места за столом и роли раздаются случайно. Играют от 4 до 8 человек.</p>
        <h2 style="margin-top:6px">Правила партии</h2>
        <div class="opts-grid">${OPTS.map(([k, n, d]) => `<label class="opt" for="o-${k}"><input type="checkbox" id="o-${k}" data-opt="${k}" ${S.options && S.options[k] ? "checked" : ""}><span><b>${n}</b><small>${d}</small></span></label>`).join("")}</div>
      </div>
    </div>
    <div class="panel" style="max-width:1100px;margin:0 auto;width:100%">
      <h2>Коротко о правилах</h2>
      <div class="rules">
        <p><b>Роли.</b> Крёстный отец открыт всем. Телохранители его защищают, Полицейские хотят его убить, Крыса хочет остаться последней.</p>
        <p><b>Ход.</b> Берёте 2 карты, играете сколько угодно карт, но «Заказ» только один. В конце в руке не больше карт, чем жизней.</p>
        <p><b>Дистанция.</b> Сколько мест между вами по кругу. «Заказ» достаёт, если дистанция не больше дальности оружия. Без оружия дальность 1.</p>
        <p><b>Защита.</b> На «Заказ» отвечают «Крышей». «Бронежилет» спасает при ♥ на проверке.</p>
        <p><b>Багажник и C4.</b> В начале хода проверка: из багажника выбираются на ♥, C4 взрывается на ♠ от 2 до 9.</p>
        <p><b>Награды.</b> Убил Полицейского — берёшь 3 карты. Крёстный убил своего Телохранителя — сбрасывает все карты.</p>
      </div>
    </div>
  </div>`;
  paintQr();
  app.querySelectorAll("[data-kick]").forEach(b => b.onclick = () => api("/api/kick", {pid:b.dataset.kick}));
  const st = document.getElementById("start"); if (st) st.onclick = () => api("/api/start");
  app.querySelectorAll("[data-opt]").forEach(el => el.onchange = () => api("/api/options", {options:{[el.dataset.opt]: el.checked}}));
}

function renderChars(){
  const left = S.players.filter(p => !p.picked).length;
  app.innerHTML = `<div class="page">
    <div class="bar"><h1>Фамилья</h1>
      <div class="tools">${left ? `<button class="btn sm" id="force">Выбрать за оставшихся (${left})</button>` : ""}<button class="btn sm ghost" id="reset">В лобби</button></div></div>
    <h2 style="text-align:center">Игроки выбирают персонажей</h2>
    <div class="chars">${S.players.map(p => `<div class="slot">${p.char ? charCard(p.char) : `<div class="wait">выбирает…</div>`}<b>${esc(p.name)}</b>${roleBadge(p.role)}</div>`).join("")}</div>
  </div>`;
  const f = document.getElementById("force"); if (f) guard(f, () => api("/api/force"));
  guard(document.getElementById("reset"), () => api("/api/reset"));
}

function renderBoard(){
  const n = S.players.length;
  const W = S.waiting;
  const seats = S.players.map((p, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    const x = 50 + 42 * Math.cos(ang), y = 50 + 44 * Math.sin(ang);
    const wait = W && W.pid === p.id && W.kind !== "turn";
    const chips = p.inPlay.map(c => `<span class="chip ${c.kind === "weapon" ? "weapon" : c.key === "trunk" || c.key === "c4" ? "danger" : "blue"}">${c.key === "c4" ? `<span class="c4tick">⏱</span> ` : ""}${esc(c.n)}</span>`).join("");
    return `<div class="seat ${p.alive ? "" : "dead"} ${S.turn === p.id && p.alive && S.phase === "play" ? "turn" : ""} ${wait ? "wait pulse" : ""}" style="left:${x}%;top:${y}%">
      ${S.turn === p.id && p.alive && S.phase === "play" ? `<span class="turn-tag">ходит</span>` : ""}
      ${p.char ? charCard(p.char) : ""}
      <div class="info">
        <div class="nm"><span class="dot ${p.online ? "on" : ""}"></span> ${p.alive ? "" : "☠ "}${esc(p.name)}</div>
        <div class="ch">${esc(p.char ? p.char.n : "")}</div>
        ${p.alive ? hearts(p.hp, p.max) : ""}
        <div>${roleBadge(p.role)}</div>
        <div class="chips"><span class="chip">🂠 ${p.hand}</span><span class="chip">дальн. ${p.range}</span>${chips}${p.zone ? `<span class="chip weapon">🏙 ${esc((S.zones.find(z => z.key === p.zone) || {}).n || "")}</span>` : ""}${p.debt != null ? `<span class="chip danger">долг ${p.debt}</span>` : ""}${S.vote && S.vote.done.includes(p.id) ? `<span class="chip">✓ голос</span>` : ""}</div>
      </div>
    </div>`;
  }).join("");
  const lc = S.lastCheck && Date.now() - S.lastCheck.at < 60000 ? S.lastCheck : null;
  app.innerHTML = `<div class="page">
    <div class="bar"><h1>Фамилья</h1>
      <div class="tools">
        ${S.phase === "play" && W ? `<button class="btn sm" id="force">${W.kind === "vote" ? "Закрыть голосование" : `Ответить за ${esc((S.players.find(p => p.id === W.pid) || {}).name || "")}`}</button>` : ""}
        <button class="btn sm ghost" id="reset">В лобби</button>
      </div></div>
    <div class="board">
      <div class="center">
        ${S.event ? `<div class="evbig"><img src="/card/ev-${S.event.key}" alt="" onerror="this.remove()"><div class="evtxt"><b>${esc(S.event.n)}</b><span>${esc(S.event.d)}</span></div></div>` : ""}
        ${S.zones ? `<div class="zrow">${S.zones.map(z => `<div class="zcard"><img src="/card/zone-${z.key}" alt="" onerror="this.remove()"><div><b>${esc(z.n)}</b><span>${z.owner ? esc((S.players.find(p => p.id === z.owner) || {}).name || "") : "свободен"}</span></div></div>`).join("")}</div>` : ""}
        ${S.vote ? `<div class="vote">🗳 Сходка: проголосовали ${S.vote.voted} из ${S.vote.total}</div>` : ""}
        <div class="now">${S.crashed ? "Ошибка игры. Начните новую партию." : W ? esc(W.text) : ""}</div>
        ${S.loot ? `<div class="hint">Делёж добычи</div><div class="lootrow">${S.loot.map(c => cardHtml(c)).join("")}</div>` : ""}
        <div class="piles">
          <div class="pile">${backCard()}<span>Колода: ${S.deck}</span></div>
          <div class="pile">${S.discardTop ? cardHtml(S.discardTop) : `<div class="card"></div>`}<span>Сброс</span></div>
        </div>
        ${lc ? `<div class="check">${cardHtml(lc.card)}<span>Проверка «${esc(lc.what)}» у ${esc((S.players.find(p => p.id === lc.pid) || {}).name || "")}:<br><span class="${lc.ok ? "ok" : "no"}">${lc.ok ? "повезло" : "не повезло"}</span></span></div>` : ""}
        <div class="log">${S.log.slice(-4).reverse().map(t => `<div>${esc(t)}</div>`).join("")}</div>
      </div>
      ${seats}
    </div>
  </div>
  ${S.phase === "over" ? `<div class="over"><div class="over-in">
    <h2>${esc(S.winner ? S.winner.text : "Игра окончена")}</h2>
    <div class="reveal">${S.players.map(p => `<div class="slot">${roleCard(p.role)}<b>${esc(p.name)}</b><span class="hint">${p.alive ? "жив" : "погиб"}</span></div>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn brass" id="again">Новая партия</button>
      <button class="btn ghost" id="lobby">В лобби</button>
    </div>
  </div></div>` : ""}`;
  const f = document.getElementById("force"); if (f) guard(f, () => api("/api/force"));
  guard(document.getElementById("reset"), () => api("/api/reset"));
  const ag = document.getElementById("again"); if (ag) ag.onclick = () => api("/api/start");
  const lb = document.getElementById("lobby"); if (lb) lb.onclick = () => api("/api/reset");
}

render();
loop();
})();
</script>
